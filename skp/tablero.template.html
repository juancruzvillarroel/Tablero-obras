<title>Modelo estructural Argerich 2984</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de obra arriba (datos + indicadores), modelo 3D a la izquierda con el corte de niveles,
   panel de trabajo a la derecha con pestañas Resumen / Elementos / Cómputo / Avance. En el celular, todo apilado. */
:root {
  --bg: #f4f4f2; --surface: #fafaf9; --raised: #ffffff; --fg: #111111; --fg2: #4d4d4d; --muted: #8a8a87; --line: #e2e2df; --line2: #eeeeec;
  --accent: #2f6fdb; --accent-ink: #ffffff; --canvas: #ececea; --hover: #f1f1ef; --ink: #111111; --ink-fg: #ffffff;
  --vidrio: rgb(255 255 255 / .86);
  --s-viga: #2a78d6; --s-columna: #eb6834; --s-losa: #1baf7a; --s-base: #eda100; --s-escalera: #e87ba4; --s-tabique: #008300; --s-viga_fundacion: #6250d6;
  --ok: #0ca30c; --warn: #fab219; --idle: #a9b3be; --crit: #d03b3b; --ghost: #9aa6b2;
  --a-portante12: #d97ad3; --a-hueco12: #62c6e0; --a-hueco8: #f0a35a; --a-hueco18: #8cc27a;
  --i-primaria: #e34948; --i-secundaria: #94552a; --i-pluvial: #eda100; --i-ventilacion: #2a78d6; --i-extraccion: #2a78d6; --i-aire: #8a96a3;
  --f-head: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e0f; --surface: #131314; --raised: #19191a; --fg: #ececec; --fg2: #b3b3b3; --muted: #7d7d7d; --line: #29292b; --line2: #202022;
  --accent: #6b9cf0; --accent-ink: #0d1520; --canvas: #0b0b0c; --hover: #212123; --ink: #ececec; --ink-fg: #111111;
  --vidrio: rgb(25 25 26 / .86);
  --s-viga: #3987e5; --s-columna: #d95926; --s-losa: #199e70; --s-base: #c98500; --s-escalera: #d55181; --s-tabique: #008300; --s-viga_fundacion: #9085e9;
  --idle: #4c5866; --ghost: #56636f; --a-portante12: #b55fb0; --a-hueco12: #3fa3bd; --a-hueco8: #c98440; --a-hueco18: #5f9a4e; --i-primaria: #e34948; --i-secundaria: #9a5b2c; --i-pluvial: #c98500; --i-ventilacion: #3987e5; --i-extraccion: #3987e5; --i-aire: #6b7785; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e0e0f; --surface: #131314; --raised: #19191a; --fg: #ececec; --fg2: #b3b3b3; --muted: #7d7d7d; --line: #29292b; --line2: #202022;
  --accent: #6b9cf0; --accent-ink: #0d1520; --canvas: #0b0b0c; --hover: #212123; --ink: #ececec; --ink-fg: #111111;
  --vidrio: rgb(25 25 26 / .86);
  --s-viga: #3987e5; --s-columna: #d95926; --s-losa: #199e70; --s-base: #c98500; --s-escalera: #d55181; --s-tabique: #008300; --s-viga_fundacion: #9085e9;
  --idle: #4c5866; --ghost: #56636f; --a-portante12: #b55fb0; --a-hueco12: #3fa3bd; --a-hueco8: #c98440; --a-hueco18: #5f9a4e; --i-primaria: #e34948; --i-secundaria: #9a5b2c; --i-pluvial: #c98500; --i-ventilacion: #3987e5; --i-extraccion: #3987e5; --i-aire: #6b7785; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=checkbox] { accent-color: var(--ink); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- Barra de obra ---------- */
/* Siempre negra, en modo claro y oscuro: es la "tapa" del estudio, con el logo en blanco. */
header.obra { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; background: #000; color: #fff; position: relative; z-index: 20;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.obra-id { display: grid; gap: 3px; min-width: 0; }
.solo-visible { color: var(--warn); font-weight: 600; }
.kpi-filtro { align-self: center; font-size: 11.5px; color: var(--warn); font-weight: 600; border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
/* Las barras del plano y del lápiz van abajo, entre la columna de niveles y capas y los íconos de herramientas. */
.barra-corte { left: calc(max(12px, env(safe-area-inset-left, 0px)) + 242px); bottom: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px; z-index: 6; flex-wrap: wrap; max-width: calc(100% - 432px); box-sizing: border-box; }
.barra-corte input[type=range] { width: 160px; accent-color: var(--ink); }
.barra-corte .btn { padding: 3px 8px; }
.barra-corte .seg { display: flex; gap: 2px; background: var(--hover); border-radius: 7px; padding: 2px; }
.barra-corte .seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.menu-ctx { z-index: 30; display: grid; padding: 4px; min-width: 200px; }
.menu-ctx button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--fg); }
.menu-ctx button:hover, .menu-ctx button:focus-visible { background: var(--hover); outline: none; }
.proy-sel { position: relative; }
.obra-id h1 { margin: 0; font: 600 20px/1.15 var(--f-head); letter-spacing: .04em; text-transform: uppercase; }
.proy-boton { all: unset; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 6px; }
.proy-boton:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.proy-boton svg { width: 14px; height: 14px; opacity: .55; transition: transform .15s, opacity .15s; }
.proy-boton:hover svg { opacity: 1; }
.proy-boton[aria-expanded="true"] svg { transform: rotate(180deg); opacity: 1; }
.proy-menu { position: absolute; top: calc(100% + 10px); left: -8px; min-width: 260px; background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 6px; display: grid; gap: 2px; z-index: 40; box-shadow: 0 12px 32px rgb(0 0 0 / .35); }
.proy-menu[hidden] { display: none; }
.proy-menu button { all: unset; display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: #fff; }
.proy-menu button:hover, .proy-menu button:focus-visible { background: #222; }
.proy-menu b { font-weight: 600; font-size: 14px; }
.proy-menu small { grid-column: 1; color: #8a8a8a; font-size: 12px; }
.proy-menu .tilde { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: #fff; font-size: 13px; }
.obra-id p { margin: 0; color: #8f8f8f; font-size: 12.5px; }
/* Menú de archivos de la obra: con qué archivos se armó el tablero y si cambiaron después de cargarlos */
.arch-sel { position: relative; }
.arch-boton { all: unset; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: #a8a8a8; font-size: 12.5px; padding: 5px 8px; border-radius: 7px; }
.arch-boton:hover, .arch-boton[aria-expanded="true"] { color: #fff; background: #1a1a1a; }
.arch-boton:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.arch-boton svg { width: 14px; height: 14px; }
.arch-boton .flecha { width: 12px; height: 12px; opacity: .6; transition: transform .15s; }
.arch-boton[aria-expanded="true"] .flecha { transform: rotate(180deg); }
.arch-alerta { width: 7px; height: 7px; border-radius: 50%; background: #f5c04a; }
.arch-menu { position: absolute; top: calc(100% + 10px); left: 0; width: min(440px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 6px; z-index: 40; box-shadow: 0 12px 32px rgb(0 0 0 / .35); color: #fff; }
.arch-menu[hidden] { display: none; }
.arch-menu h3 { margin: 6px 10px 8px; font: 600 10.5px var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: #8a8a8a; }
.arch-item { padding: 10px; border-radius: 8px; display: grid; gap: 3px; }
.arch-item + .arch-item { border-top: 1px solid #222; border-radius: 0; }
.arch-item .rol { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #8a8a8a; }
.arch-item .nom { font-weight: 600; font-size: 13.5px; word-break: break-word; }
.arch-item .carp { font-size: 11.5px; color: #7a7a7a; word-break: break-word; }
.arch-item .fechas { font-size: 12px; color: #b5b5b5; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; }
.arch-item .fechas b { color: #fff; font-weight: 500; }
.arch-estado { justify-self: start; margin-top: 4px; font-size: 11.5px; border-radius: 999px; padding: 2px 8px; border: 1px solid #333; color: #a8a8a8; }
.arch-estado.cambio { color: #f5c04a; border-color: #5a4612; }
.arch-estado.falta { color: #ff8a80; border-color: #5c2420; }
.arch-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.arch-fila .arch-estado { margin-top: 0; }
.arch-act { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; background: #fff; color: #111; border-radius: 7px; padding: 4px 10px; }
.arch-act:hover { background: #e6e6e6; }
.arch-act:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.arch-act[disabled] { opacity: .35; cursor: default; }
.arch-act.secundario { background: transparent; color: #e6e6e6; box-shadow: inset 0 0 0 1px #444; }
.arch-act.secundario:hover { background: #1a1a1a; }
.arch-act[aria-disabled="true"] { opacity: .45; }
.arch-prog { flex-basis: 100%; font-size: 12px; color: #d0d0d0; line-height: 1.5; display: flex; align-items: flex-start; gap: 8px; }
.arch-prog.ok { color: #9be39b; display: block; }
.arch-prog.mal { color: #ff8a80; display: block; }
.arch-prog b { color: #fff; }
.giro { width: 12px; height: 12px; margin-top: 3px; border: 2px solid #555; border-top-color: #fff; border-radius: 50%; animation: giro .8s linear infinite; flex: none; }
@keyframes giro { to { transform: rotate(360deg); } }
.arch-quitar { all: unset; cursor: pointer; font-size: 12px; color: #a8a8a8; border: 1px solid #333; border-radius: 7px; padding: 3px 9px; }
.arch-quitar:hover { color: #ff8a80; border-color: #5c2420; }
.arch-quitar:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.arch-quitar[disabled] { opacity: .35; cursor: default; color: #a8a8a8; border-color: #333; }
.arch-cab { display: flex; align-items: center; justify-content: space-between; margin: 2px 6px 6px 0; }
.arch-cab h3 { margin: 6px 10px 2px; }
.arch-plus { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 400 20px/1 var(--f-body); color: #fff; background: #222; }
.arch-plus:hover { background: #333; }
.arch-plus:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.arch-plus[disabled] { opacity: .35; cursor: default; }
.arch-tit { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.arch-tacho { all: unset; cursor: pointer; color: #8a8a8a; width: 26px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.arch-tacho:hover { color: #ff8a80; background: #1f1414; }
.arch-tacho:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.arch-tacho[aria-disabled="true"] { opacity: .35; }
.arch-tacho[aria-disabled="true"]:hover { color: #8a8a8a; background: none; }
.arch-soltar { display: grid; gap: 2px; justify-items: center; text-align: center; padding: 14px 10px; border: 1px dashed #444; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.arch-soltar span { color: #8a8a8a; font-size: 11.5px; }
.arch-soltar:hover, .arch-soltar.encima { border-color: #888; background: #151515; }
.arch-de-carpeta summary { cursor: pointer; font-size: 12px; color: #a8a8a8; margin-bottom: 6px; }
.arch-de-carpeta[open] { display: grid; gap: 6px; }
.arch-mas { all: unset; cursor: pointer; display: block; margin: 6px 10px 2px; font-size: 12.5px; font-weight: 600; color: #fff; border: 1px dashed #444; border-radius: 8px; padding: 8px 10px; text-align: center; }
.arch-mas:hover { background: #1a1a1a; border-color: #666; }
.arch-mas[disabled] { opacity: .35; cursor: default; }
.arch-agregar { margin: 6px 4px 2px; padding: 10px; border: 1px solid #2a2a2a; border-radius: 10px; display: grid; gap: 8px; background: #0b0b0b; }
.arch-agr-cab { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
.arch-x { all: unset; cursor: pointer; color: #8a8a8a; padding: 0 4px; }
.arch-x:hover { color: #fff; }
.arch-buscar { width: 100%; box-sizing: border-box; background: #161616; border: 1px solid #333; border-radius: 7px; color: #fff; padding: 6px 8px; font-size: 12.5px; }
.arch-lista { max-height: 220px; overflow-y: auto; display: grid; gap: 1px; }
.arch-lista button { all: unset; cursor: pointer; display: grid; gap: 1px; padding: 6px 8px; border-radius: 6px; }
.arch-lista button:hover { background: #1c1c1c; }
.arch-lista button[aria-selected="true"] { background: #fff; color: #111; }
.arch-lista button[aria-selected="true"] .carp { color: #555; }
.arch-lista .nom { font-size: 12.5px; font-weight: 600; word-break: break-word; }
.arch-lista .carp { font-size: 11px; color: #7a7a7a; word-break: break-word; }
.arch-rol { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #bdbdbd; }
.arch-rol select { flex: 1; background: #161616; color: #fff; border: 1px solid #333; border-radius: 7px; padding: 5px 6px; font-size: 12.5px; }
.arch-agregar .arch-act { justify-self: start; }
.arch-pie { margin: 6px 10px 6px; font-size: 11.5px; color: #7a7a7a; line-height: 1.45; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-left: auto; }
.kpi { display: grid; gap: 2px; }
.kpi span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: #8a8a8a; }
.kpi b { font: 500 18px var(--f-mono); font-variant-numeric: tabular-nums; color: #fff; }
.kpi b small { font: 400 12px var(--f-body); color: #a8a8a8; margin-left: 3px; }
.kpi .barrita { height: 3px; border-radius: 2px; background: #333; overflow: hidden; margin-top: 3px; }
header.obra .solo-visible, .kpi-filtro { color: #f5c04a; }
/* El logo va primero, a la izquierda de todo, separado del nombre de la obra por una línea fina. */
.logo { height: 36px; width: auto; display: block; filter: brightness(0) invert(1); padding-right: 24px; border-right: 1px solid #2a2a2a; margin-right: -8px; }
.kpi .barrita i { display: block; height: 100%; background: var(--ok); }

/* ---------- Vista 3D ---------- */
.vista { position: relative; min-width: 0; min-height: 0; background: var(--canvas); overflow: hidden; }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#lienzo.sobre { cursor: pointer; }
.flota { position: absolute; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); }

.leyenda { left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; z-index: 3; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; max-width: calc(100% - 170px); }
.leyenda[hidden] { display: none; }
/* Columna izquierda: niveles arriba y capas abajo; si no entra, se desplazan las capas. */
.columna-izq { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 60px; width: 230px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 2; }
.columna-izq > .flota { position: static; pointer-events: auto; }
.capas { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 6px 8px 8px; font-size: 12.5px; }
.capas-cab { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 6px; }
.capas-cab b { font: 600 10.5px var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.capas-cab button { border: 0; background: none; color: var(--fg2); text-decoration: underline; text-underline-offset: 2px; font-size: 11.5px; cursor: pointer; padding: 0; }
.capa-grupo + .capa-grupo { border-top: 1px solid var(--line2); margin-top: 4px; padding-top: 4px; }
.capa-gcab { display: flex; align-items: center; gap: 2px; font-weight: 600; }
.capa-gcab label, .capa label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; min-width: 0; }
.capa-gcab .pliegue { border: 0; background: none; width: 18px; cursor: pointer; color: var(--muted); padding: 0; }
.capa { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 20px; }
.capa span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.capa .muestra { width: 26px; height: 16px; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; flex: none; padding: 0; }
.capa-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 4px 0 6px 40px; font-size: 12px; color: var(--fg2); }
.capa-editor[hidden] { display: none; }
.capa-editor label { display: flex; align-items: center; gap: 4px; }
.capa-editor input[type=color] { width: 30px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.capa-editor select { font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--raised); }
.capa-editor .btn { padding: 2px 8px; font-size: 11.5px; }
.leyenda div { display: flex; align-items: center; gap: 7px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.corte { flex: none; padding: 6px; display: grid; gap: 2px; }
.corte h3 { margin: 2px 6px 4px; font: 600 10.5px var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.corte h3 button { border: 0; background: none; color: var(--fg2); text-decoration: underline; text-underline-offset: 2px; font-size: 11.5px; cursor: pointer; padding: 0; text-transform: none; letter-spacing: 0; }
.nivel { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.nivel:hover { background: var(--hover); }
.nivel .cota { font: 11.5px var(--f-mono); color: var(--muted); }
.nivel[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); }
.nivel[aria-pressed="true"] .cota { color: inherit; opacity: .8; }
.nivel.apagado { opacity: .4; }
.alcance { margin: 4px 6px 2px; display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--fg2); }
.tipos { display: none !important; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 150px); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
/* Abajo a la derecha, las herramientas (lápiz y plano de sección) como íconos; arriba a la derecha, las vistas. */
.acciones3d { right: 12px; bottom: 12px; display: flex; gap: 2px; padding: 3px; }
.acciones3d button { border: 0; background: none; border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: var(--fg); }
.acciones3d button:hover { background: var(--hover); }
.vistas { top: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; padding: 2px; max-width: calc(100% - 266px); }
.vistas button { border: 0; background: none; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.vistas button:hover { background: var(--hover); }
.vistas .sep { width: 1px; background: var(--line); margin: 4px 3px; }

})();

];
const NOM_TIPO = Object.fromEntries(TIPOS.map(t => [t[0], t[2]]));
const ESTADOS = [['pendiente', 'Pendiente', '--idle'], ['ejecucion', 'En ejecución', '--warn'], ['hormigonado', 'Hormigonado', '--ok']];
const NOM_EST = Object.fromEntries(ESTADOS.map(e => [e[0], e[1]]));

NIV.forEach(n => { n.losa = n.corto; n.corto = n.piso || NOMBRE_PISO[n.id] || n.corto; }); const nivIdx = Object.fromEntries(NIV.map((n, i) => [n.id, i]));

// Cambiar de obra: la flecha junto al nombre abre la lista. Se cierra con Esc o tocando afuera.
{ const b = $('#proyBoton'), m = $('#proyMenu');

  const abrirMenu = si => { m.hidden = !si; b.setAttribute('aria-expanded', si); if (si) m.querySelector('button')?.focus(); };

    if (it.dataset.proy === PROY.id) return;
    try { localStorage.setItem('tablero.proyecto', it.dataset.proy); location.reload(); } catch (e) { alert('Este navegador no deja guardar la obra elegida.'); } };
  m.onkeydown = ev => { const its = [...m.querySelectorAll('button')], i = its.indexOf(document.activeElement);
    if (ev.key === 'Escape') { abrirMenu(false); b.focus(); }
    else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); its[(i + (ev.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length].focus(); } };
  document.addEventListener('pointerdown', ev => { if (!m.hidden && !ev.target.closest('.proy-sel')) abrirMenu(false); }); }

// Archivos de la obra: nombre, carpeta dentro de la obra, última modificación y cuándo se cargó al tablero.

// SketchUp y su AutoCAD, y después publica: la página online se actualiza sola en uno o dos minutos.
{ const b = $('#archBoton'), m = $('#archMenu');
  const EN_LA_COMPU = /^(localhost|127\.0\.0\.1)$/.test(location.hostname), BASE = EN_LA_COMPU ? '' : 'http://localhost:5180';
  let A = PROY.archivos || [], local = false, sinServidor = false, trabajo = null, sondeo = null, opciones = [], agregando = null, info = {};
  const CARGA = Date.now();
  const fecha = s => s ? new Date(s).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '') : '—';
  const EST = { 'al dia': ['', 'Al día'], cambio: ['cambio', 'Cambió después de cargarlo: el tablero no tiene esos cambios'], falta: ['falta', 'No está en la carpeta'], pendiente: ['', 'Agregado: falta procesarlo para verlo en el modelo'] };
  const mio = () => trabajo && trabajo.proyecto === PROY.id;
  const TACHO = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';
  function resultadoTxt(r) {
    if (!r || !r.antes) return '';
    const a = r.antes, d = r.despues, dif = (k, u, dd) => Math.abs(d[k] - a[k]) > 1e-6 ? `${fmt(a[k], dd)} → <b>${fmt(d[k], dd)}</b> ${u}` : `${fmt(d[k], dd)} ${u} (sin cambios)`;
    return [`Elementos: ${dif('elementos', '', 0)}`, `Hormigón: ${dif('hormigon', 'm³', 2)}`, d.tramos || a.tramos ? `Caños: ${dif('tramos', 'tramos', 0)}` : '', d.pases || a.pases ? `Pases: ${dif('pases', '', 0)}` : '', d.muros || a.muros ? `Muros: ${dif('superficie', 'm²', 1)}` : ''].filter(Boolean).join('<br>');
  }

  const final = () => trabajo.ok ? `<div class="arch-prog ok">${trabajo.resultado && trabajo.resultado.pendiente ? 'Agregado a la lista.' : 'Listo.'} ${EN_LA_COMPU ? 'Recargando el tablero…' : ''}<br>${resultadoTxt(trabajo.resultado)}${publicadoTxt(trabajo.resultado)}${EN_LA_COMPU ? '' : '<br><button type="button" class="arch-act" id="archRecargar" style="margin-top:6px">Recargar la página</button>'}</div>`

// Lleva la cámara al elemento: mantiene la dirección desde la que se mira y se acerca hasta que la pieza entra
// con aire en la parte libre de la vista (sin la columna de niveles), sea una columna o una losa entera.

  const dir = camara.position.clone().sub(ctrl.target).normalize(), der = new THREE.Vector3().setFromMatrixColumn(camara.matrixWorld, 0);

// ---------- Qué entra en los cómputos ----------

function sumas(lista) { return lista.reduce((a, e) => (a.vol += e.vol, a.enc += e.enc, a.acero += acero(e), a.losa += e.t === 'losa' ? e.area || 0 : 0, a), { vol: 0, enc: 0, acero: 0, losa: 0 }); }
function avance(lista) { const t = lista.reduce((a, e) => a + e.vol, 0) || 1, h = lista.filter(e => hecho(e.id)).reduce((a, e) => a + e.vol, 0); return { t, hormigonado: h, pct: h / t * 100 }; }

function refrescarComputo() {

  const presentes = TIPOS.filter(t => l.some(e => e.t === t[0]));
  const suma = (t, f) => l.filter(e => e.t === t).reduce((a, e) => a + f(e), 0);
  const pr = { hormigon: +precios.hormigon || 0, acero: +precios.acero || 0 };
  const hayPrecio = pr.hormigon || pr.acero;
  let total$ = 0;

  presentes.forEach(t => { const v = suma(t[0], e => e.vol); h += `<tr><td><span class="sw" style="display:inline-block;margin-right:6px;background:var(--s-${t[0]})"></span>${t[1]}</td><td class="r num">${fmt(v, 2)}</td><td>m³</td><td></td>${sub(v * (1 + desperdicio / 100), pr.hormigon)}</tr>`; });

  h += `<tr><td><b>Total</b> <span style="color:var(--muted)">sin desperdicio</span></td><td class="r num"><b>${fmt(vTot, 2)}</b></td><td>m³</td><td></td><td></td></tr>`;

  $('#tablaComp').innerHTML = h;

}

// ---------- Instalación sanitaria (cloacal y pluvial) ----------
// Cada tramo trae sus puntos en cm, en el mismo sistema que la estructura. Las cañerías de un piso
// van por el cielorraso del piso de abajo, salvo las aclaraciones del plano (contrapiso, pared, desvíos).
// Las piezas (codos, ramales, cuplas, PPA, embudos, bocas de acceso y cámara) se dibujan con su forma real
// aproximada, más gruesas que el caño, con su campana (enchufe) en cada boca.
const SIS_ORDEN = ['primaria', 'secundaria', 'pluvial', 'ventilacion', 'extraccion', 'aire'];
// Cada piso va con su nivel del corte: el 1° piso con las columnas del 1° y la losa sobre el 1° (S/1°).
// Losa con la que se muestra cada piso de la instalación: la trae la obra (Condarco) o, si no, la de Argerich y Habana
const PISO_NIVEL = SAN.pisos.some(p => p.nivel) ? Object.fromEntries(SAN.pisos.map(p => [p.id, p.nivel])) : { PB: 'sPB', P1: 's1', P2: 's2', P3: 's3', P4: 's4', P5: 's5' };
const NOM_PISO = Object.fromEntries(SAN.pisos.map(p => [p.id, p.nombre]));
const NOM_MODO = {
  cielorraso: 'colgado bajo losa', bajo_viga: 'por debajo de la viga', contrapiso: 'por contrapiso', pared: 'por pared',
  muro: 'embutido en muro', mesada: 'bajo mesada, baja en la pared', cocina: 'bajo mesada, baja por la pared y por contrapiso a la B.A.', enterrado: 'enterrado', montante: 'montante', caida: 'caída de artefacto',
};
const NOM_ORIGEN = { montante: 'montante', artefacto: 'caída de artefacto', inodoro: 'inodoro', PPA: 'pileta de patio', embudo: 'embudo pluvial', pared: 'baja en pase (por pared)', contrapiso: 'baja en pase (por contrapiso)', mesada: 'bajada de cocina' };
const NOM_PIEZA = { ppa: 'Pileta de patio abierta (PPA)', embudo: 'Embudo pluvial con rejilla', ba: 'Boca de acceso', camara: 'Cámara de inspección 60x60', codo: 'Codo', ramal: 'Ramal', cupla: 'Cupla' };
const PREF_BAJADA = { primaria: 'CDV', ventilacion: 'CV', pluvial: 'Pluvial', secundaria: 'B' };
const VIGAS_CRUZADAS = new Set(SAN.cruces.map(k => k.vigaId));
const sanOn = Object.fromEntries(SIS_ORDEN.map(s => [s, true])); sanOn.pases = true; sanOn.cruces = true; sanOn.numeros = true; sanOn.artefactos = true;
const SANP = {}; const sanMallas = [];
const v3 = (x, y, z) => new THREE.Vector3(x - OX, z, -(y - OY));
const d3 = d => new THREE.Vector3(d[0], d[2], -d[1]);            // dirección del plano -> three
const colorOsc = (c, k) => new THREE.Color(c).multiplyScalar(k);
const matSis = {}, matPza = {};
const mS = s => matSis[s] ||= new THREE.MeshLambertMaterial({ color: css('--i-' + s) });
const mP = s => matPza[s] ||= new THREE.MeshLambertMaterial({ color: colorOsc(css('--i-' + s), 0.72) });
const matMetal = new THREE.MeshLambertMaterial({ color: 0xb9c0c7 }), matRanura = new THREE.MeshLambertMaterial({ color: 0x3c434a });
const matHormigon = new THREE.MeshLambertMaterial({ color: 0x9a9fa5 });
const matSelSan = new THREE.MeshLambertMaterial({ color: css('--accent'), emissive: 0x222222 });
const merge = gs => THREE.BufferGeometryUtils.mergeBufferGeometries(gs.map(g => g.index ? g.toNonIndexed() : g));
const UP = new THREE.Vector3(0, 1, 0);
// Cilindro entre dos puntos (three)
function cil(a, b, r, seg = 12) {
  const L = a.distanceTo(b); if (L < 1e-4) return null;
  const g = new THREE.CylinderGeometry(r, r, L, seg, 1, false);
  g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, b.clone().sub(a).normalize())));
  g.translate((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2); return g;
}
// Campana de enchufe: anillo más grueso al borde de una pieza, hacia adentro de la pieza
const campana = (p, dir, d) => cil(p.clone().addScaledVector(dir, -Math.max(0.6 * d, 0.03)), p, d / 2 * 1.26 + 0.004, 14);
// Curva (codo) entre dos puntos pasando cerca de la esquina
function curva(A, P, B, r) { const g = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(A, P, B), 10, r, 12, false); return g; }
const radioVis = d => Math.max(d / 2, 0.022);
const kCodo = d => 1.1 * d + 0.03;

// Puntos con codo/ramal/cupla: el caño se recorta ahí para que la pieza cierre
const clave = p => p.map(v => Math.round(v * 100)).join(',');
const enUnion = {}; SAN.uniones.forEach(u => { enUnion[clave(u.p)] = u; });

// --- Caños ---
for (const tr of SAN.tramos) {
  const P = []; for (let i = 0; i < tr.p.length; i += 3) P.push([tr.p[i] / 100, tr.p[i + 1] / 100, tr.p[i + 2] / 100]);
  const pts = P.map(p => v3(...p)), r = radioVis(tr.d), k = kCodo(tr.d), partes = [], piezas = [];
  // recorte en extremos que llegan a un codo o cupla
  const recortar = (i, hacia) => { const u = enUnion[clave(P[i])]; if (!u || u.tipo === 'ramal') return pts[i]; return pts[i].clone().lerp(pts[hacia], Math.min(0.45, kCodo(u.d) / pts[i].distanceTo(pts[hacia]))); };
  const ini = [recortar(0, 1)], fin = recortar(pts.length - 1, pts.length - 2);
  // esquinas internas: codo con curva y campanas
  const tramosRectos = []; let desde = ini[0];
  for (let i = 1; i < pts.length - 1; i++) {
    const d1 = pts[i].clone().sub(pts[i - 1]).normalize(), d2 = pts[i + 1].clone().sub(pts[i]).normalize();
    if (d1.dot(d2) > 0.995) continue;
    const kk = Math.min(k, 0.45 * pts[i].distanceTo(pts[i - 1]), 0.45 * pts[i].distanceTo(pts[i + 1]));
    const A = pts[i].clone().addScaledVector(d1, -kk), B = pts[i].clone().addScaledVector(d2, kk);
    tramosRectos.push([desde, A]); desde = B;
    piezas.push(curva(A, pts[i], B, r * 1.13), campana(A, d1.clone().negate(), tr.d), campana(B, d2, tr.d));
  }
  tramosRectos.push([desde, fin]);
  for (const [a, b] of tramosRectos) { const g = cil(a, b, r); if (g) partes.push(g); }
  // montantes: un enchufe en cada cruce de losa
  if (tr.modo === 'montante') for (const n of NIV) { const z = n.z; if (z > P[0][2] + 0.3 && z < P[P.length - 1][2] - 0.3) { const c = v3(P[0][0], P[0][1], z + 0.25); partes.push(cil(c.clone().setY(c.y - 0.04), c.clone().setY(c.y + 0.04), r * 1.26)); } }
  if (!partes.length) continue;
  const g = new THREE.Group(); g.userData.id = 'san:' + tr.id;
  const caño = new THREE.Mesh(merge(partes), mS(tr.sis)); caño.userData.id = g.userData.id; g.add(caño);
  if (piezas.filter(Boolean).length) { const m = new THREE.Mesh(merge(piezas.filter(Boolean)), mP(tr.sis)); m.userData.id = g.userData.id; g.add(m); }
  escena.add(g); sanMallas.push(caño, ...g.children.slice(1));
  const mid = pts[Math.floor((pts.length - 1) / 2)].clone().lerp(pts[Math.ceil((pts.length - 1) / 2)], 0.5);
  SANP[g.userData.id] = { k: 'tramo', o: tr, m: g, ppal: caño, nivel: PISO_NIVEL[tr.piso], centro: mid };
}

// --- Uniones: codos, ramales y cuplas ---
SAN.uniones.forEach((u, i) => {
  const p = v3(...u.p), a = d3(u.a).normalize(), b = d3(u.b).normalize(), gs = [];
  if (u.tipo === 'codo') {
    const k = kCodo(u.d), A = p.clone().addScaledVector(a, k), B = p.clone().addScaledVector(b, k);
    gs.push(curva(A, p, B, radioVis(u.d) * 1.13), campana(A, a, u.d), campana(B, b, u.d));
  } else if (u.tipo === 'ramal') {
    const L = 1.3 * u.d + 0.04, A = p.clone().addScaledVector(a, -L), B = p.clone().addScaledVector(a, L);
    gs.push(cil(A, B, radioVis(u.d) * 1.13), campana(A, a.clone().negate(), u.d), campana(B, a, u.d));
    const C = p.clone().addScaledVector(b, u.d / 2 + 0.6 * u.dr + 0.04);
    gs.push(cil(p, C, radioVis(u.dr) * 1.13), campana(C, b, u.dr));
  } else {
    const L = 0.6 * u.d + 0.03; gs.push(cil(p.clone().addScaledVector(a, -L), p.clone().addScaledVector(a, L), radioVis(u.d) * 1.26));
  }
  const m = new THREE.Mesh(merge(gs.filter(Boolean)), mP(u.sis)); m.userData.id = 'uni:' + i; escena.add(m); sanMallas.push(m);
  SANP[m.userData.id] = { k: 'union', o: u, m, ppal: m, nivel: null, centro: p };
});

// --- Piezas especiales ---
function rejilla(c, lado, alto) { // marco + rejilla con ranuras, apoyada en el piso terminado
  const gs = [new THREE.BoxGeometry(lado, 0.012, lado).translate(c.x, c.y + 0.006, c.z)];
  const ran = []; const n = 5, paso = lado * 0.8 / n;
  for (let i = 0; i < n; i++) ran.push(new THREE.BoxGeometry(lado * 0.7, 0.004, paso * 0.35).translate(c.x, c.y + 0.0135, c.z - lado * 0.4 + paso * (i + 0.5)));
  return [merge(gs), merge(ran)];
}
SAN.piezas.forEach((pz, i) => {
  const id = 'pz:' + i, g = new THREE.Group(); g.userData.id = id;
  const top = v3(pz.x, pz.y, pz.z);
  const add = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.userData.id = id; g.add(m); sanMallas.push(m); };
  if (pz.tipo === 'ppa') {
    const fondo = pz.zFondo ?? pz.z - 0.3;
    add(cil(v3(pz.x, pz.y, fondo), v3(pz.x, pz.y, pz.z - 0.01), 0.085, 20), mP('secundaria'));
    add(cil(v3(pz.x, pz.y, fondo - 0.08), v3(pz.x, pz.y, fondo + 0.01), 0.06, 16), mP('secundaria'));   // salida
    for (const e of pz.entradas || []) { const dir = d3([e[0], e[1], 0]).normalize(); const c = v3(pz.x, pz.y, fondo + 0.05).addScaledVector(dir, 0.085); add(cil(c, c.clone().addScaledVector(dir, 0.06), 0.032, 12), mP('secundaria')); }
    const [marco, ranuras] = rejilla(top, 0.2); add(marco, matMetal); add(ranuras, matRanura);
  } else if (pz.tipo === 'embudo') {
    const cono = new THREE.CylinderGeometry(0.11, 0.06, 0.14, 20, 1, true).translate(top.x, top.y - 0.07, top.z);
    add(cono, mP('pluvial'));
    const [marco, ranuras] = rejilla(top, 0.2); add(marco, matMetal); add(ranuras, matRanura);
  } else if (pz.tipo === 'ba') {
    add(new THREE.BoxGeometry(0.22, 0.2, 0.22).translate(top.x, top.y - 0.1, top.z), mP('primaria'));
    add(new THREE.BoxGeometry(0.24, 0.012, 0.24).translate(top.x, top.y + 0.006, top.z), matMetal);
  } else if (pz.tipo === 'camara') {
    const c = v3(pz.x, pz.y, -0.33);
    const caja = new THREE.BoxGeometry(0.7, 0.66, 0.7).translate(c.x, c.y, c.z); add(caja, matHormigon);
    add(new THREE.BoxGeometry(0.6, 0.02, 0.6).translate(c.x, 0.01, c.z), matMetal);
  }
  if (!g.children.length) return;
  escena.add(g);
  SANP[id] = { k: 'pieza', o: pz, m: g, ppal: g.children[0], nivel: PISO_NIVEL[pz.piso], centro: top };
});

// --- Artefactos sanitarios: forma simplificada, apoyados en el piso y con la descarga donde baja su caño ---
// Coordenadas locales: x a lo ancho, y hacia arriba, z hacia el frente del artefacto; el origen es la descarga.
const NOM_ART = { inodoro: 'Inodoro', bidet: 'Bidet', bacha: 'Bacha / lavatorio', ducha: 'Ducha', pileta: 'Pileta de cocina', lavarropas: 'Lavarropas', lavajillas: 'Lavavajillas' };
const matPorc = new THREE.MeshLambertMaterial({ color: 0xf3f4f6 }), matMesada = new THREE.MeshLambertMaterial({ color: 0xc4c8ce });

const bordeArt = new THREE.LineBasicMaterial({ color: 0x5b6570, transparent: true, opacity: 0.45 });
const caja = (w, h, d, x, y, z) => new THREE.BoxGeometry(w, h, d).translate(x, y, z);

function formaArtefacto(tipo, a = {}) {

    o.push(elipse(0.13, 0.19, 0.01, 0, 0.385, 0.12));

    p.push(elipse(0.17, 0.25, 0.4, 0, 0.2, 0.08, 1.04)); o.push(elipse(0.12, 0.18, 0.01, 0, 0.405, 0.1));
  } else if (tipo === 'bacha') {

    o.push(elipse(0.2, 0.15, 0.01, 0, 0.845, 0.07)); m.push(cil(new THREE.Vector3(0, 0.84, -0.12), new THREE.Vector3(0, 1.0, -0.12), 0.015));

  } else if (tipo === 'pileta') {
    mu.push(caja(1.2, 0.86, 0.58, 0, 0.43, 0.06)); p.push(caja(1.24, 0.04, 0.62, 0, 0.88, 0.06));
    o.push(caja(0.5, 0.01, 0.38, 0, 0.905, 0.08)); m.push(cil(new THREE.Vector3(0, 0.9, -0.17), new THREE.Vector3(0, 1.15, -0.17), 0.016));
  } else if (tipo === 'lavarropas' || tipo === 'lavajillas') {
    p.push(caja(0.6, 0.85, 0.6, 0, 0.425, 0.15));
    if (tipo === 'lavarropas') { const g = new THREE.CylinderGeometry(0.18, 0.18, 0.02, 24).rotateX(Math.PI / 2).translate(0, 0.5, 0.455); o.push(g); }

const ARTE = [];
SAN.artefactos.forEach((a, i) => {
  const id = 'art:' + i, g = new THREE.Group(); g.userData.id = id;
  const f = formaArtefacto(a.tipo, a);
  // Con posición de arquitectura el punto es el centro del artefacto: se corre la forma para centrarla.
  const OFF = { inodoro: 0.02, bidet: 0.08, bacha: 0.05, ducha: 0.1, pileta: 0.06, lavarropas: 0.15, lavajillas: 0.15 };
  const cont = new THREE.Group(); if (a.centrado) cont.position.z = -(OFF[a.tipo] || 0); g.add(cont);
  for (const [lista, mat] of [[f.p, matPorc], [f.o, matOscuro], [f.m, matMetal], [f.mu, matMueble]]) {
    const gs = lista.filter(Boolean); if (!gs.length) continue;
    const geo = merge(gs), mesh = new THREE.Mesh(geo, mat); mesh.userData.id = id; cont.add(mesh); sanMallas.push(mesh);
    if (mat === matPorc || mat === matMueble) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), bordeArt); cont.add(e); }
  }

  g.rotation.y = Math.atan2(a.frente[0], -a.frente[1]);
  escena.add(g); ARTE.push(g);
  SANP[id] = { k: 'artefacto', o: a, m: g, ppal: cont.children[0], nivel: PISO_NIVEL[a.piso], centro: v3(a.x, a.y, a.z + 0.4) };
});

// ---------- Albañilería (CAD de muros de cada obra) ----------
// Nombre del archivo de la obra del que sale cada parte (el que figura en el menú Archivos)
const archivoDe = proceso => ((PROY.archivos || []).find(a => a.proceso === proceso) || {}).nombre;
// Cada muro es un elemento: su planta exacta (rectángulos a 1 cm de los filos dibujados) extruida desde el piso
// hasta el fondo de la losa o viga de arriba. Colores como en el CAD: rosa portante 12, celeste hueco 12, naranja hueco 8.
const TIPO_MURO = { portante12: 'Ladrillo portante 12', hueco12: 'Ladrillo hueco 12', hueco8: 'Ladrillo hueco 8', ...(ALB.muros.some(m => m.tipo === 'hueco18') ? { hueco18: 'Ladrillo hueco 18' } : {}) };
// Pisos de los muros: cada obra puede traer los suyos en albanileria.json (Libertador: azotea y techo de la sala de
// máquinas); si no, los de Argerich.
const PISO_MURO = ALB.pisos ? Object.fromEntries(Object.entries(ALB.pisos).map(([k, p]) => [k, p.nivel])) : { PB: 'sPB', P1: 's1', P2: 's2', P3: 's3', P4: 's4', P5: 's5', SM: 'sSM' };
const NOM_PISO_MURO = ALB.pisos ? Object.fromEntries(Object.entries(ALB.pisos).map(([k, p]) => [k, p.nombre])) : { PB: 'Planta baja', P1: '1° piso', P2: '2° piso', P3: '3° piso', P4: '4° piso', P5: 'Azotea', SM: 'Sala de máquinas' };
const LADRILLOS_DEF = { portante12: 15, hueco12: 15, hueco8: 15, hueco18: 15 };      // unidades por m² (ladrillo de 33 cm de largo)
let ladrillos = { ...LADRILLOS_DEF, ...leer('ladrillos', {}) };
const albOn = { muros: true };
const matMuro = {}; const mM = t => matMuro[t] ||= new THREE.MeshLambertMaterial({ color: css('--a-' + t), transparent: true });
const bordeMuro = new THREE.LineBasicMaterial({ color: 0x3a3f45, transparent: true, opacity: 0.35 });
const MUROS = [];
for (const m of ALB.muros) {
  const geo = geoMuro(m), mesh = new THREE.Mesh(geo, mM(m.tipo));
  const id = 'muro:' + m.id; mesh.userData.id = id;
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), bordeMuro));
  escena.add(mesh); sanMallas.push(mesh); MUROS.push(mesh);
  const c = m.cajas.reduce((a, r) => a.add(new THREE.Vector3((r[0] + r[2]) / 2 - OX, (m.z0 + m.z1) / 2, -((r[1] + r[3]) / 2 - OY))), new THREE.Vector3()).divideScalar(m.cajas.length);
  SANP[id] = { k: 'muro', o: m, m: mesh, ppal: mesh, nivel: PISO_MURO[m.piso], centro: c };
}
const ladrillosDe = m => m.sup * (ladrillos[m.tipo] || 0);
let despAlb = leer('despAlb', 5);
function pintarMuros() {
  const inst = modo === 'instalacion';
  for (const mesh of MUROS) {
    const s = SANP[mesh.userData.id];
    mesh.visible = capaOn(s.o.tipo) && visibleNivel(s.nivel) && !ocultos.has(mesh.userData.id);
    const sel = seleccion === mesh.userData.id, hov = hover === mesh.userData.id;
    mesh.material = mM(s.o.tipo);
    vestir(mesh.material, s.o.tipo, !inst); mesh.material.opacity = inst ? 0.12 : 1; mesh.material.depthWrite = !inst;
    mesh.children[0].visible = !inst;
  }
}
// Pestaña Albañilería
function refrescarAlbanileria() {
  if (!ALB.muros.length) { $('#p-albanileria').innerHTML = '<section><h2>Albañilería</h2><p class="nota">Este proyecto todavía no tiene muros cargados. Se pueden dibujar con el lápiz (abajo del modelo) o cargarlos desde el CAD de muros.</p></section>'; return; }
  const M = ALB.muros.filter(cuentaMuro).map(enCorteMuro);
  const tot = M.reduce((a, m) => (a.sup += m.sup, a.vol += m.vol, a.lad += ladrillosDe(m), a.largo += m.largo, a), { sup: 0, vol: 0, lad: 0, largo: 0 });
  let h = '';
  if (seleccion && SANP[seleccion]?.k === 'muro') h += '<section><h2>Elemento</h2>' + fichaSan(seleccion).replace('id="cerrarFicha"', 'data-cerrar') + '</section>';
  h += `<section><h2>Albañilería <small>${nivelSel ? (hastaAca ? 'hasta ' : '') + NIV[nivIdx[nivelSel]].corto : 'toda la obra'} · ${esc(ALB.fuente || archivoDe('alb') || 'CAD de albañilería')}${marcaVisible()}</small></h2>
    <div class="medidas" style="grid-template-columns:repeat(4,minmax(0,1fr))">

// ---------- Elementos y avance de obra por rubro ----------
// Cada elemento (estructura, muro, caño o artefacto) se tilda como hecho. El avance de cada rubro se mide en su

const RUBROS = [['estructura', 'Estructura H°A', 'm³'], ['albanileria', 'Albañilería', 'm²'], ['sanitaria', 'Instalación sanitaria', 'm']];
function itemsObra() {

  for (const [id, s] of Object.entries(SANP)) {
    if (s.k === 'tramo') { const t = s.o; it.push({ id, rubro: 'sanitaria', nivel: s.nivel, nombre: `Ø${Math.round(t.d * 1000)} ${SAN.sistemas[t.sis]}`, tipo: NOM_MODO[t.modo], det: t.num ? `${PREF_BAJADA[t.sis]} ${t.num}` : '', cant: t.largo, un: 'm', color: `var(--i-${t.sis})` }); }
    else if (s.k === 'artefacto') it.push({ id, rubro: 'sanitaria', nivel: s.nivel, nombre: NOM_ART[s.o.tipo], tipo: 'Artefacto', det: '', cant: 0, un: 'u', color: 'var(--fg2)' });

function avanceDe(lista) { const t = lista.reduce((a, i) => a + i.cant, 0), h = lista.filter(i => hecho(i.id)).reduce((a, i) => a + i.cant, 0); return { t, h, pct: t ? h / t * 100 : 0 }; }
function marcarHecho(ids, valor) {
  ids.forEach(id => { if (valor) hechos[id] = true; else delete hechos[id]; });
  guardar('hechos', hechos);
  pintar(); refrescarKpis(); refrescarAvance(); refrescarElementos(); if (seleccion) { refrescarResumen(); if (pestana === 'albanileria') refrescarAlbanileria(); if (pestana === 'sanitaria') refrescarSanitaria(); }

// Prender o apagar elementos (ojo de la lista y de la ficha). Lo apagado no se ve en el modelo ni suma en los cómputos.

function ponerOcultos(ids, ocultar) {
